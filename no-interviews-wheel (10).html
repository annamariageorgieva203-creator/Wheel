<title>No Interviews</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;0,9..144,900;1,9..144,600&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950: #0a1830;
    --navy-900: #0d1e3b;
    --navy-800: #12244a;
    --navy-700: #1a3358;
    --navy-600: #24416c;
    --line: rgba(214,228,255,0.14);
    --line-soft: rgba(214,228,255,0.07);
    --text: #f4f7fc;
    --text-dim: #9aabc9;
    --text-faint: #64769a;
    --lime: #b4ff00;
    --lime-soft: rgba(180,255,0,0.14);
    --lime-ink: #12210a;
    --sky: #5ac8fa;
    --white: #ffffff;
    --used: #2c3f60;
    --used-mark: #7286ac;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    background:
      radial-gradient(95ch 72ch at -4% -10%, rgba(180,255,0,0.52), transparent 60%),
      radial-gradient(85ch 68ch at 104% -2%, rgba(90,200,255,0.50), transparent 60%),
      radial-gradient(90ch 70ch at 50% 108%, rgba(90,200,255,0.34), transparent 65%),
      radial-gradient(60ch 50ch at 50% 40%, rgba(180,255,0,0.14), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 3px),
      var(--navy-800);
    color: var(--text);
    font-family: 'Inter', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
    position: relative;
  }

  .top-stripe{
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 5;
    height: 6px;
    background: linear-gradient(90deg, var(--lime), var(--sky), var(--lime));
    background-size: 200% 100%;
    animation: stripe-flow 6s linear infinite;
  }
  @keyframes stripe-flow{ to{ background-position: 200% 0; } }

  .shell{
    min-height: 100vh;
    box-sizing: border-box;
    padding-top: 6px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  /* ---------- stage lighting ---------- */

  .stage-fx{
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .beam{
    position: absolute;
    top: -6%;
    left: 50%;
    width: 950px;
    height: 820px;
    transform: translateX(-50%);
    background: conic-gradient(from 180deg at 50% 0%, transparent 0deg, rgba(180,255,0,0.46) 9deg, rgba(180,255,0,0.12) 22deg, transparent 36deg, transparent 324deg, rgba(90,200,255,0.12) 338deg, rgba(90,200,255,0.42) 351deg, transparent 360deg);
    filter: blur(2px);
  }
  .floor-glow{
    position: absolute;
    top: 590px;
    left: 50%;
    width: 860px;
    height: 320px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(180,255,0,0.34), rgba(90,200,255,0.2) 45%, transparent 72%);
  }
  .spark{
    position: absolute;
    width: 5px; height: 5px;
    border-radius: 50%;
    animation: spark-blink 3s ease-in-out infinite;
  }
  .spark:nth-child(odd){ background: var(--lime); box-shadow: 0 0 7px var(--lime); }
  .spark:nth-child(even){ background: var(--sky); box-shadow: 0 0 7px var(--sky); }
  @keyframes spark-blink{ 0%,100%{ opacity: 0.9; } 50%{ opacity: 0.15; } }

  /* ---------- header ---------- */

  .top{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
    padding: 18px 24px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    text-align: center;
    box-sizing: border-box;
  }

  .brand{
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .brand-hub, .brand-by{
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 900;
    font-size: 22px;
    letter-spacing: -0.01em;
    color: var(--text);
  }

  .eyebrow{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 800;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text-faint);
  }

  /* ---------- tab switcher ---------- */

  .switcher{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 980px;
    margin: 14px auto 0;
    padding: 0 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    box-sizing: border-box;
  }

  .tab-btn{
    position: relative;
    display: flex;
    align-items: center;
    gap: 13px;
    text-align: left;
    padding: 13px 18px;
    border-radius: 15px;
    border: 1px solid rgba(90,200,255,0.4);
    background: linear-gradient(160deg, rgba(90,200,255,0.20), var(--navy-700) 60%);
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
  }
  .tab-btn:hover{ transform: translateY(-2px); border-color: var(--sky); background: linear-gradient(160deg, rgba(90,200,255,0.28), var(--navy-600) 60%); }
  .tab-btn:focus-visible{ outline: 2px solid var(--lime); outline-offset: 2px; }

  .tab-btn .tab-ico{
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--navy-950);
    border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    flex: none;
  }
  .tab-btn .tab-ico svg{ width: 18px; height: 18px; stroke: var(--text-dim); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  .tab-btn .tab-copy{ min-width: 0; }
  .tab-btn .tab-num{
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 15.5px;
    font-weight: 800;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text);
  }

  .tab-btn[aria-selected="true"]{
    background: var(--lime);
    border-color: var(--lime);
    box-shadow: 0 10px 24px -6px rgba(180,255,0,0.35);
  }
  .tab-btn[aria-selected="true"] .tab-ico{ background: var(--lime-ink); border-color: transparent; }
  .tab-btn[aria-selected="true"] .tab-ico svg{ stroke: var(--lime); }
  .tab-btn[aria-selected="true"] .tab-num{ color: var(--lime-ink); }
  .tab-btn[aria-selected="true"]::after{
    content: "";
    position: absolute;
    bottom: -6px; left: 50%;
    transform: translateX(-50%) rotate(45deg);
    width: 10px; height: 10px;
    background: var(--lime);
    border-radius: 2px;
  }

  /* ---------- stage panel ---------- */

  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 1440px;
    margin: 0 auto;
    padding: 16px 20px 20px;
    box-sizing: border-box;
  }

  .panel{
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fade-in 0.35s ease both;
  }
  .panel[hidden]{ display: none; }
  @keyframes fade-in{
    0%{ opacity: 0; transform: translateY(8px); }
    100%{ opacity: 1; transform: translateY(0); }
  }

  .panel-title{
    margin: 0 0 13px;
    font-family: 'Fraunces', Georgia, serif;
    font-weight: 600;
    font-style: italic;
    font-size: 18px;
    color: var(--text);
    text-align: center;
  }

  .panel-body{
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 36px;
    width: 100%;
  }

  .wheel-col{
    display: flex;
    flex-direction: column;
    align-items: center;
    flex: 1 1 450px;
    max-width: 450px;
    min-width: 280px;
  }

  .result-col{
    display: flex;
    flex-direction: column;
    flex: 1 1 450px;
    max-width: 450px;
    min-width: 280px;
    padding-top: 2px;
  }

  .wheel-wrap{
    position: relative;
    width: clamp(190px, min(35vh, 58vw), 340px);
    height: clamp(190px, min(35vh, 58vw), 340px);
    margin-bottom: 15px;
  }

  .wheel-halo{
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    background: conic-gradient(from 0deg, var(--lime), var(--sky), var(--lime) 50%, var(--sky) 75%, var(--lime) 100%);
    filter: blur(3px);
    opacity: 0.85;
    z-index: 0;
    animation: halo-spin 10s linear infinite;
  }
  @keyframes halo-spin{ to{ transform: rotate(360deg); } }

  .wheel-rim{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 1;
    box-shadow: 0 0 0 5px var(--white), 0 0 0 8px var(--navy-950), 0 20px 46px -16px rgba(0,0,0,0.5);
    animation: rim-pulse 2.8s ease-in-out infinite;
  }
  @keyframes rim-pulse{
    0%,100%{ box-shadow: 0 0 0 5px var(--white), 0 0 0 8px var(--navy-950), 0 0 34px 6px rgba(180,255,0,0.4), 0 20px 46px -16px rgba(0,0,0,0.5); }
    50%{ box-shadow: 0 0 0 5px var(--white), 0 0 0 8px var(--navy-950), 0 0 58px 16px rgba(90,200,255,0.65), 0 20px 46px -16px rgba(0,0,0,0.5); }
  }

  .wheel-gloss{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    z-index: 4;
    pointer-events: none;
    background: linear-gradient(120deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.1) 16%, transparent 32%, transparent 100%);
  }

  .pointer{
    position: absolute;
    top: -7px; left: 50%;
    transform: translateX(-50%);
    z-index: 6;
    width: 0; height: 0;
    border-left: 9px solid transparent;
    border-right: 9px solid transparent;
    border-top: 15px solid var(--white);
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.5));
  }
  .pointer::before{
    content: "";
    position: absolute;
    top: -18px; left: 50%;
    transform: translateX(-50%);
    width: 11px; height: 11px;
    border-radius: 50%;
    background: var(--lime);
    box-shadow: 0 0 0 3px var(--navy-950), 0 0 12px rgba(180,255,0,0.7);
  }

  .wheel-rotor{
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
    z-index: 2;
    transition: transform 3.8s cubic-bezier(0.11,0.66,0.16,1);
    will-change: transform;
  }
  .wheel-rotor svg{ width: 100%; height: 100%; display: block; }

  .slice{ stroke: rgba(244,247,252,0.28); stroke-width: 1.4; filter: drop-shadow(0 1px 1.5px rgba(0,0,0,0.4)); }
  .slice-mark{
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    font-weight: 700;
    fill: var(--used-mark);
    text-anchor: middle;
    dominant-baseline: central;
    pointer-events: none;
  }

  .confetti-layer{
    position: absolute;
    inset: -50px;
    pointer-events: none;
    overflow: visible;
    z-index: 8;
  }
  .confetti-piece{
    position: absolute;
    top: 50%; left: 50%;
    width: 7px; height: 7px;
    margin: -3.5px 0 0 -3.5px;
  }

  .cap{
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    width: 38px; height: 38px;
    border-radius: 50%;
    background: linear-gradient(145deg, var(--navy-600), var(--navy-800));
    border: 2px solid var(--navy-950);
    box-shadow: 0 0 0 2px var(--line);
    z-index: 5;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cap svg{ width: 15px; height: 15px; stroke: var(--text-dim); fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .cap::after{
    content: "";
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px solid var(--lime);
    opacity: 0;
    animation: pulse-ring 2.6s ease-out infinite;
  }
  .cap.spinning::after{ animation-play-state: paused; opacity: 0; }
  @keyframes pulse-ring{
    0%{ transform: scale(0.8); opacity: 0.5; }
    70%{ transform: scale(1.7); opacity: 0; }
    100%{ opacity: 0; }
  }

  /* ---------- press button ---------- */

  .press-btn{
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 11px;
    width: 100%;
    max-width: 420px;
    padding: 15px 22px;
    border: none;
    border-radius: 15px;
    background: linear-gradient(125deg, var(--lime) 55%, var(--sky) 145%);
    color: var(--lime-ink);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 800;
    font-size: 15.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    overflow: hidden;
    box-shadow: 0 0 0 1px var(--line), 0 7px 0 0 var(--navy-950), 0 18px 30px -8px rgba(90,200,255,0.28);
    transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.15s ease;
  }
  .press-btn::before{
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.38), transparent 55%);
    pointer-events: none;
  }
  .press-btn:hover:not(:disabled){ transform: translateY(-2px); box-shadow: 0 0 0 1px var(--line), 0 9px 0 0 var(--navy-950), 0 22px 34px -8px rgba(90,200,255,0.4); }
  .press-btn:active:not(:disabled){ transform: translateY(5px); box-shadow: 0 0 0 1px var(--line), 0 2px 0 0 var(--navy-950), 0 6px 10px rgba(0,0,0,0.4); }
  .press-btn:disabled{ cursor: not-allowed; filter: grayscale(0.55) brightness(0.7); }
  .press-btn:focus-visible{ outline: 2px solid var(--white); outline-offset: 3px; }
  .press-btn.pop{ animation: squash 0.5s ease; }
  @keyframes squash{
    0%{ transform: scale(1); }
    30%{ transform: scale(1.05,0.85); }
    55%{ transform: scale(0.95,1.08); }
    78%{ transform: scale(1.02,0.97); }
    100%{ transform: scale(1); }
  }

  /* ---------- readout + reset ---------- */

  .readout{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    width: 100%;
    margin-top: 11px;
    background: linear-gradient(135deg, rgba(90,200,255,0.16), var(--navy-800) 55%);
    border: 1px solid rgba(90,200,255,0.32);
    border-radius: 12px;
    padding: 10px 15px 10px 17px;
  }
  .readout-text{
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    color: var(--text-faint);
  }
  .readout-digits{
    color: var(--lime);
    font-weight: 800;
    text-shadow: 0 0 8px rgba(180,255,0,0.5);
  }
  .toggle-btn{
    background: var(--navy-800);
    border: 1px solid var(--line);
    color: var(--text-dim);
    font-family: 'Inter', sans-serif;
    font-size: 13.5px;
    font-weight: 600;
    padding: 8px 13px;
    border-radius: 10px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
  }
  .toggle-btn svg{ width: 12px; height: 12px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; transition: transform 0.4s ease; }
  .toggle-btn:hover{ border-color: var(--lime); color: var(--lime); }
  .toggle-btn:hover svg{ transform: rotate(-130deg); }
  .toggle-btn:focus-visible{ outline: 2px solid var(--lime); outline-offset: 2px; }

  /* ---------- ticket slip ---------- */

  .slip{
    position: relative;
    width: 100%;
    margin-top: 6px;
    background: linear-gradient(160deg, rgba(180,255,0,0.12), var(--navy-800) 40%);
    border: 1px solid var(--line-soft);
    border-left: 4px solid var(--lime);
    border-radius: 0 0 13px 13px;
    padding: 19px 21px 14px 19px;
    min-height: 0;
    display: flex;
    align-items: center;
    clip-path: polygon(
      0 7px, 5% 0, 10% 7px, 15% 0, 20% 7px, 25% 0, 30% 7px, 35% 0, 40% 7px, 45% 0,
      50% 7px, 55% 0, 60% 7px, 65% 0, 70% 7px, 75% 0, 80% 7px, 85% 0, 90% 7px, 95% 0, 100% 7px,
      100% 100%, 0 100%
    );
    transition: transform 0.18s ease;
  }
  .slip.flash{ transform: scale(1.012); }
  .slip p{
    margin: 0;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 17.5px;
    line-height: 1.42;
    color: var(--text);
  }
  .slip.placeholder p{ color: var(--text-faint); font-style: normal; font-family: 'Inter', sans-serif; font-size: 14.5px; font-weight: 500; }
  .slip.empty p{ color: var(--text-faint); font-style: normal; font-family: 'Inter', sans-serif; font-size: 14.5px; }

  /* ---------- clarifying questions bubble ---------- */

  .clue-bubble{
    position: relative;
    width: 100%;
    margin-top: 8px;
    background: linear-gradient(165deg, rgba(90,200,255,0.14), var(--navy-800) 50%);
    border: 1px solid rgba(90,200,255,0.35);
    border-radius: 4px 15px 15px 15px;
    padding: 12px 18px 13px;
    animation: bubble-in 0.22s ease both;
  }
  .clue-bubble[hidden]{ display: none; }
  .clue-label{
    display: block;
    margin: 0 0 7px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    font-weight: 800;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--sky);
  }
  .clue-bubble ul{
    margin: 0;
    padding: 0;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .clue-bubble li{
    position: relative;
    padding-left: 20px;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    font-weight: 500;
    line-height: 1.4;
    color: var(--text-dim);
  }
  .clue-bubble li::before{
    content: "?";
    position: absolute;
    left: 0;
    top: -1px;
    color: var(--lime);
    font-weight: 800;
    font-family: 'JetBrains Mono', monospace;
    font-size: 14.5px;
  }
  @keyframes bubble-in{
    0%{ opacity: 0; transform: translateY(-6px); }
    100%{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- history log ---------- */

  .log{
    width: 100%;
    font-size: 13px;
    margin-top: 5px;
  }
  .log summary{
    cursor: pointer;
    color: var(--text-dim);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    list-style: none;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 2px 0;
    user-select: none;
  }
  .log summary::-webkit-details-marker{ display: none; }
  .log summary::before{
    content: "▸";
    color: var(--lime);
    transition: transform 0.15s ease;
    font-size: 10px;
  }
  .log[open] summary::before{ transform: rotate(90deg); }
  .log summary:focus-visible{ outline: 2px solid var(--lime); outline-offset: 2px; border-radius: 4px; }

  .log-list{
    margin: 6px 0 0;
    padding: 9px 11px 9px 9px;
    background: linear-gradient(160deg, rgba(90,200,255,0.09), var(--navy-800) 45%);
    border: 1px solid var(--line-soft);
    border-left: 3px solid var(--sky);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    gap: 5px;
    color: var(--text-dim);
    line-height: 1.4;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    max-height: 170px;
    overflow-y: auto;
  }
  .log-list li{ list-style: none; padding-left: 16px; position: relative; }
  .log-list li::before{ content: "›"; position: absolute; left: 0; color: var(--sky); font-weight: 700; }
  .log-list li em{ font-style: normal; color: var(--text); font-family: 'Inter', sans-serif; }

  /* ---------- compact sizing for narrow (stacked) layouts ---------- */
  @media (max-width: 480px){
    .top{ padding: 12px 20px 0; }
    .brand-hub, .brand-by{ font-size: 17px; }
    .eyebrow{ font-size: 11px; }
    .switcher{ margin: 9px auto 0; padding: 0 20px; gap: 9px; }
    .tab-btn{ padding: 9px 12px; gap: 9px; border-radius: 13px; }
    .tab-btn .tab-ico{ width: 27px; height: 27px; }
    .tab-btn .tab-ico svg{ width: 13px; height: 13px; }
    .tab-btn .tab-num{ font-size: 12px; }
    .stage{ padding: 10px 18px 14px; }
    .panel-title{ font-size: 14.5px; margin: 0 0 8px; }
    .panel-body{ gap: 20px; }
    .wheel-wrap{ width: clamp(150px, min(26vh, 52vw), 210px); height: clamp(150px, min(26vh, 52vw), 210px); margin-bottom: 10px; }
    .press-btn{ max-width: 320px; padding: 11px 17px; font-size: 13px; }
    .readout{ margin-top: 8px; padding: 7px 11px 7px 13px; border-radius: 10px; }
    .readout-text{ font-size: 11.5px; }
    .toggle-btn{ font-size: 11.5px; padding: 6px 10px; }
    .slip{ padding: 13px 15px 10px 13px; }
    .slip p{ font-size: 14px; }
    .slip.placeholder p, .slip.empty p{ font-size: 12px; }
    .clue-bubble{ padding: 8px 13px 9px; margin-top: 6px; }
    .clue-label{ font-size: 9.5px; margin: 0 0 4px; }
    .clue-bubble li{ font-size: 12px; padding-left: 17px; }
    .clue-bubble li::before{ font-size: 12.5px; }

<script>
(function(){
  "use strict";

  var QUESTIONS = {
    a: [
      { q: "Разкажи за случай, в който помогна на някого, без да те моли.", subs: ["Каква беше ситуацията?", "Какво направи?", "Какъв беше резултатът?"] },
      { q: "Как обясни нещо трудно по лесен начин?", subs: ["Какво трябваше да обясниш?", "Как разбра дали човекът те разбира?", "Какъв беше резултатът?"] },
      { q: "Опиши ситуация, в която помогна на някого да открие грешка.", subs: ["Как разбра, че има грешка?", "Как помогна?", "Как реагира човекът?"] },
      { q: "Какво направи, когато някой не разбра обяснението ти?", subs: ["Как разбра, че не те разбира?", "Как промени обяснението си?", "Успя ли накрая да те разбере?"] },
      { q: "Разкажи как показа на някого по-бърз начин да направи нещо.", subs: ["Какво правеше човекът преди?", "Какво му показа?", "Какво се промени след това?"] },
      { q: "Спомни си нещо полезно, което откри и сподели с другите.", subs: ["Какво откри?", "Защо реши да го споделиш?", "Беше ли полезно за другите?"] },
      { q: "Разкажи за полезен инструмент или приложение, което препоръча на някого.", subs: ["Защо реши да го препоръчаш?", "Как обясни с какво е полезно?", "Използва ли го човекът след това?"] },
      { q: "Опиши ситуация, в която научи някого на нещо ново.", subs: ["Какво искаше да му покажеш?", "Как го обясни?", "Успя ли човекът да го направи сам след това?"] },
      { q: "Дай пример за твоя идея, която помогна на цялата група.", subs: ["Как ти хрумна идеята?", "Как я сподели с останалите?", "Какво се промени благодарение на нея?"] },
      { q: "Разкажи за случай, в който някой потърси съвет от теб.", subs: ["За какво поиска съвет?", "Какво му предложи?", "Помогна ли му съветът ти?"] },
      { q: "Спомни си ситуация, в която показа нещо на практика, вместо само да го обясниш.", subs: ["Какво трябваше да покажеш?", "Защо реши да го покажеш на практика?", "Помогна ли това на другия човек?"] },
      { q: "Как помогна на някого да поправи грешка, без да го засегнеш?", subs: ["Как му показа, че има грешка?", "Как подходи към него?", "Как реагира човекът?"] }
    ],
    b: [
      { q: "Разкажи за нещо, което направи, без някой да ти го възлага.", subs: ["Как забеляза, че има нужда да се направи?", "Какво направи?", "Какъв беше резултатът?"] },
      { q: "Дай пример за нещо ново, което измисли и направи.", subs: ["Как ти хрумна идеята?", "Как я превърна в действие?", "Какво се получи накрая?"] },
      { q: "Разкажи за ситуация, в която намери по-добър начин да направиш нещо.", subs: ["Как се правеше преди?", "Какво реши да промениш?", "По-добре ли се получи?"] },
      { q: "Спомни си проблем, който реши сам.", subs: ["Какъв беше проблемът?", "Как реши какво да направиш?", "Какъв беше резултатът?"] },
      { q: "Как постъпи, когато нещо се обърка?", subs: ["Какво се случи?", "Какво направи?", "Как приключи ситуацията?"] },
      { q: "Разкажи за идея, която реши да пробваш, без да знаеш дали ще се получи.", subs: ["Как ти хрумна?", "Защо реши да я пробваш?", "Какво се получи?"] },
      { q: "Опиши ситуация, в която предложи нещо да се прави по различен начин.", subs: ["Какво искаше да промениш?", "Защо предложи промяната?", "Как реагираха другите?"] },
      { q: "Разкажи как от проблем ти хрумна идея за нещо ново.", subs: ["Какъв беше проблемът?", "Каква идея ти хрумна?", "Какво направи с нея?"] },
      { q: "Дай пример за нещо, за което отдели допълнително време, за да се получи.", subs: ["Защо беше важно за теб?", "Какво допълнително направи?", "Струваше ли си усилието?"] },
      { q: "Спомни си трудна задача, с която реши да се заемеш.", subs: ["Какво я правеше трудна?", "Как започна?", "Как се справи накрая?"] },
      { q: "Разкажи за ситуация, в която реши да действаш, вместо да продължаваш да обсъждаш.", subs: ["Какво трябваше да се направи?", "Защо реши да действаш?", "Какъв беше резултатът?"] },
      { q: "Какво направи, когато нещо не се получи от първия път?", subs: ["Какво не се получи?", "Какво промени при следващия опит?", "Какво се случи накрая?"] }
    ]
  };

  var SVG_NS = "http://www.w3.org/2000/svg";
  var CX = 100, CY = 100, R = 96;
  var N = 12;
  var SLICE_ANGLE = 360 / N;
  var REDUCED_MOTION = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var CONFETTI_COLORS = ["#b4ff00", "#5ac8fa", "#ffffff"];
  var STAR_CLIP = "polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%)";
  var WHEEL_COLORS = {
    a: ["url(#gradLime-a)", "url(#gradNavy-a)", "url(#gradSky-a)"],
    b: ["url(#gradSky-b)", "url(#gradNavy-b)", "url(#gradLime-b)"]
  };

  function gemDefsMarkup(key){
    return (
      '<linearGradient id="gradLime-' + key + '" x1="12%" y1="0%" x2="88%" y2="100%">' +
        '<stop offset="0%" stop-color="#eeffbf"/>' +
        '<stop offset="42%" stop-color="#b4ff00"/>' +
        '<stop offset="100%" stop-color="#5c8500"/>' +
      '</linearGradient>' +
      '<linearGradient id="gradSky-' + key + '" x1="12%" y1="0%" x2="88%" y2="100%">' +
        '<stop offset="0%" stop-color="#e2f7ff"/>' +
        '<stop offset="42%" stop-color="#5ac8fa"/>' +
        '<stop offset="100%" stop-color="#26789f"/>' +
      '</linearGradient>' +
      '<linearGradient id="gradNavy-' + key + '" x1="12%" y1="0%" x2="88%" y2="100%">' +
        '<stop offset="0%" stop-color="#5876a8"/>' +
        '<stop offset="50%" stop-color="#24416c"/>' +
        '<stop offset="100%" stop-color="#101f3d"/>' +
      '</linearGradient>' +
      '<linearGradient id="gradUsed-' + key + '" x1="12%" y1="0%" x2="88%" y2="100%">' +
        '<stop offset="0%" stop-color="#40597f"/>' +
        '<stop offset="100%" stop-color="#182741"/>' +
      '</linearGradient>'
    );
  }

  /* ---- tab switcher ---- */

  var tabA = document.getElementById("tab-a");
  var tabB = document.getElementById("tab-b");
  var panelA = document.getElementById("panel-a");
  var panelB = document.getElementById("panel-b");

  function setActive(key){
    var aOn = key === "a";
    tabA.setAttribute("aria-selected", aOn ? "true" : "false");
    tabB.setAttribute("aria-selected", aOn ? "false" : "true");
    panelA.hidden = !aOn;
    panelB.hidden = aOn;
  }
  tabA.addEventListener("click", function(){ setActive("a"); });
  tabB.addEventListener("click", function(){ setActive("b"); });

  function setTabsDisabled(disabled){
    tabA.disabled = disabled;
    tabB.disabled = disabled;
  }

  function polar(cx, cy, r, angleDeg){
    var a = (angleDeg) * Math.PI / 180;
    return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
  }

  function sliceStart(i){ return -90 + i * SLICE_ANGLE; }
  function sliceEnd(i){ return sliceStart(i) + SLICE_ANGLE; }

  function sliceD(i){
    var p1 = polar(CX, CY, R, sliceStart(i));
    var p2 = polar(CX, CY, R, sliceEnd(i));
    var large = SLICE_ANGLE > 180 ? 1 : 0;
    return "M " + CX + " " + CY + " L " + p1[0].toFixed(2) + " " + p1[1].toFixed(2) +
      " A " + R + " " + R + " 0 " + large + " 1 " + p2[0].toFixed(2) + " " + p2[1].toFixed(2) + " Z";
  }

  function burstConfetti(layerEl){
    if (REDUCED_MOTION || !layerEl || !layerEl.animate) return;
    var count = 32;
    for (var i = 0; i < count; i++){
      var piece = document.createElement("div");
      piece.className = "confetti-piece";
      var color = CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)];
      var shape = Math.random();
      piece.style.background = color;
      if (shape < 0.55){
        piece.style.borderRadius = "50%";
      } else if (shape < 0.8){
        piece.style.borderRadius = "2px";
      } else {
        piece.style.clipPath = STAR_CLIP;
        piece.style.width = "10px";
        piece.style.height = "10px";
        piece.style.margin = "-5px 0 0 -5px";
      }
      layerEl.appendChild(piece);

      var angle = Math.random() * Math.PI * 2;
      var dist = 70 + Math.random() * 95;
      var dx = Math.cos(angle) * dist;
      var dy = Math.sin(angle) * dist;
      var rot = (Math.random() - 0.5) * 480;
      var dur = 650 + Math.random() * 450;

      var anim = piece.animate([
        { transform: "translate(0,0) rotate(0deg) scale(1)", opacity: 1 },
        { transform: "translate(" + dx + "px," + dy + "px) rotate(" + rot + "deg) scale(0.6)", opacity: 0 }
      ], { duration: dur, easing: "cubic-bezier(0.2,0.8,0.2,1)", fill: "forwards" });

      (function(el){
        anim.onfinish = function(){ if (el.parentNode) el.parentNode.removeChild(el); };
      })(piece);
    }
  }

  function makeWheel(key, svgId, rotorId, hubId, spinBtnId, labelId, resetBtnId, resultId, countId, historyListId, historyCountId, confettiId, clueBubbleId, clueListId){
    var svg = document.getElementById(svgId);
    var rotor = document.getElementById(rotorId);
    var hub = document.getElementById(hubId);
    var spinBtn = document.getElementById(spinBtnId);
    var label = document.getElementById(labelId);
    var resetBtn = document.getElementById(resetBtnId);
    var resultEl = document.getElementById(resultId);
    var countEl = document.getElementById(countId);
    var historyList = document.getElementById(historyListId);
    var historyCount = document.getElementById(historyCountId);
    var confettiLayer = document.getElementById(confettiId);
    var clueBubble = document.getElementById(clueBubbleId);
    var clueList = document.getElementById(clueListId);

    var questions = QUESTIONS[key];
    var colors = WHEEL_COLORS[key];
    var remaining = [];
    var slicePaths = [];
    var sliceMarks = [];
    var rotation = 0;
    var spinning = false;
    var drawnOrder = [];

    function resetState(){
      remaining = [];
      for (var i = 0; i < N; i++) remaining.push(i);
      drawnOrder = [];
      historyList.innerHTML = "";
      historyCount.textContent = "0";
      resultEl.className = "slip placeholder";
      resultEl.innerHTML = "<p>Натисни ВЪРТИ, за да изтеглиш първия въпрос.</p>";
      spinBtn.disabled = false;
      label.textContent = "Върти";
      hideClue();
      updateCount();
      paintAll();
    }

    function hideClue(){
      clueBubble.hidden = true;
      clueList.innerHTML = "";
    }

    function updateCount(){
      countEl.innerHTML = "<span class=\"readout-digits\">" + remaining.length + "</span> от " + N + " остават";
    }

    function paintSlice(i, used){
      var tone = colors[i % colors.length];
      slicePaths[i].setAttribute("fill", used ? "url(#gradUsed-" + key + ")" : tone);
      sliceMarks[i].textContent = used ? "✓" : "";
    }

    function paintAll(){
      for (var i = 0; i < N; i++) paintSlice(i, remaining.indexOf(i) === -1);
    }

    function buildSVG(){
      svg.innerHTML = "";
      var defs = document.createElementNS(SVG_NS, "defs");
      defs.innerHTML = gemDefsMarkup(key);
      svg.appendChild(defs);
      var g = document.createElementNS(SVG_NS, "g");
      svg.appendChild(g);
      for (var i = 0; i < N; i++){
        var path = document.createElementNS(SVG_NS, "path");
        path.setAttribute("d", sliceD(i));
        path.setAttribute("class", "slice");
        g.appendChild(path);
        slicePaths.push(path);

        var mid = polar(CX, CY, R * 0.72, sliceStart(i) + SLICE_ANGLE / 2);
        var mark = document.createElementNS(SVG_NS, "text");
        mark.setAttribute("x", mid[0].toFixed(2));
        mark.setAttribute("y", mid[1].toFixed(2));
        mark.setAttribute("class", "slice-mark");
        g.appendChild(mark);
        sliceMarks.push(mark);
      }
    }

    function normalize(x){ return ((x % 360) + 360) % 360; }

    function addHistoryEntry(text){
      drawnOrder.push(text);
      var li = document.createElement("li");
      li.innerHTML = "<em>" + text + "</em>";
      historyList.appendChild(li);
      historyCount.textContent = String(drawnOrder.length);
    }

    function land(index){
      var pos = remaining.indexOf(index);
      if (pos !== -1) remaining.splice(pos, 1);
      paintSlice(index, true);
      updateCount();

      var item = questions[index];
      resultEl.className = "slip flash";
      resultEl.innerHTML = "<p>“" + item.q + "”</p>";
      addHistoryEntry(item.q);
      setTimeout(function(){ resultEl.classList.remove("flash"); }, 220);

      clueList.innerHTML = "";
      for (var s = 0; s < item.subs.length; s++){
        var li = document.createElement("li");
        li.textContent = item.subs[s];
        clueList.appendChild(li);
      }
      clueBubble.hidden = false;

      burstConfetti(confettiLayer);

      spinBtn.classList.add("pop");
      setTimeout(function(){ spinBtn.classList.remove("pop"); }, 520);

      spinning = false;
      hub.classList.remove("spinning");
      setTabsDisabled(false);
      if (remaining.length === 0){
        spinBtn.disabled = true;
        label.textContent = "Готово";
      } else {
        spinBtn.disabled = false;
        label.textContent = "Върти";
      }
    }

    function onTransitionEnd(e){
      if (e.target !== rotor || e.propertyName !== "transform") return;
      rotor.removeEventListener("transitionend", onTransitionEnd);
      land(rotor._pendingIndex);
    }

    function spin(){
      if (spinning || remaining.length === 0) return;
      spinning = true;
      spinBtn.disabled = true;
      hub.classList.add("spinning");
      setTabsDisabled(true);
      hideClue();

      var pick = remaining[Math.floor(Math.random() * remaining.length)];
      var jitter = (Math.random() - 0.5) * SLICE_ANGLE * 0.6;
      var targetFromTop = pick * SLICE_ANGLE + SLICE_ANGLE / 2 + jitter;

      var extraTurns = REDUCED_MOTION ? 1 : (4 + Math.floor(Math.random() * 3));
      var delta = normalize(-targetFromTop - rotation);
      rotation = rotation + delta + 360 * extraTurns;

      rotor._pendingIndex = pick;
      rotor.style.transform = "rotate(" + rotation + "deg)";
      rotor.addEventListener("transitionend", onTransitionEnd);
    }

    spinBtn.addEventListener("click", spin);
    resetBtn.addEventListener("click", function(){
      if (spinning) return;
      resetState();
    });

    buildSVG();
    resetState();
  }

  makeWheel("a", "svg-a", "rotor-a", "hub-a", "spin-a", "label-a", "reset-a", "result-a", "count-a", "history-list-a", "history-count-a", "confetti-a", "clue-bubble-a", "clue-list-a");
  makeWheel("b", "svg-b", "rotor-b", "hub-b", "spin-b", "label-b", "reset-b", "result-b", "count-b", "history-list-b", "history-count-b", "confetti-b", "clue-bubble-b", "clue-list-b");
})();
</script>
